<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <h1>Angular Learning</h1>
      <p>A simple, printable introduction to JavaScript, TypeScript, and Angular.</p>
    </div>

    <div class="topbar-actions">
      <button class="secondary-button" type="button" (click)="toggleTheme()">
        {{ theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>
      <button class="primary-button" type="button" (click)="printChapter()">
        Print chapter
      </button>
    </div>
  </header>

  <router-outlet />
</div>
