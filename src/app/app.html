<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <h1>Angular Learning</h1>
      <p>A simple, printable introduction to JavaScript, TypeScript, and Angular.</p>
    </div>

    <div class="topbar-actions">
      <button class="secondary-button" type="button" (click)="toggleTheme()">
        {{ theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
      </button>

      <div class="print-menu">
        <button class="primary-button" type="button" (click)="printCurrent()">
          Print / PDF
        </button>
        <details class="print-more" #printMenu>
          <summary class="secondary-button" title="More print options">▾</summary>
          <div class="print-options">
            <button type="button" (click)="printMenu.open = false; printCurrent()">
              This chapter
            </button>
            <button type="button" (click)="printMenu.open = false; printAll()">
              All chapters
            </button>
          </div>
        </details>
      </div>
    </div>
  </header>

  <router-outlet />
</div>
